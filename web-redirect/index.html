<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guestful Clicks — Join Event</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0C0904;
      color: #F0E8D5;
      font-family: Georgia, 'Times New Roman', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 48px;
    }
    .logo-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #D4A853;
    }
    .logo-text {
      font-size: 11px;
      letter-spacing: 3px;
      color: #F0E8D5;
    }

    .film-icon {
      font-size: 64px;
      margin-bottom: 24px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.08); }
    }

    h1 {
      font-size: 28px;
      font-weight: normal;
      color: #F0E8D5;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .sub {
      font-size: 15px;
      color: rgba(240, 232, 213, 0.55);
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .open-btn {
      display: block;
      background: #D4A853;
      color: #0C0904;
      font-family: Georgia, serif;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-decoration: none;
      padding: 18px 40px;
      border-radius: 4px;
      margin-bottom: 20px;
      cursor: pointer;
      border: none;
      width: 100%;
      max-width: 340px;
    }
    .open-btn:active { opacity: 0.85; }

    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.08);
      width: 100%;
      max-width: 340px;
      margin: 24px 0;
    }

    .install-section { max-width: 340px; width: 100%; }
    .install-label {
      font-size: 12px;
      color: rgba(240,232,213,0.4);
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }

    .store-btns {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .store-btn {
      flex: 1;
      min-width: 130px;
      border: 1px solid rgba(212,168,83,0.35);
      border-radius: 10px;
      padding: 12px 16px;
      color: #D4A853;
      text-decoration: none;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .store-btn span { font-size: 20px; }

    .code-badge {
      margin-top: 36px;
      border: 1px solid rgba(212,168,83,0.2);
      border-radius: 10px;
      padding: 14px 20px;
      max-width: 340px;
      width: 100%;
    }
    .code-label {
      font-size: 11px;
      color: rgba(240,232,213,0.4);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .code-value {
      font-size: 20px;
      color: #D4A853;
      letter-spacing: 4px;
    }

    .note {
      margin-top: 32px;
      font-size: 12px;
      color: rgba(240,232,213,0.3);
      max-width: 300px;
      line-height: 1.6;
    }

    #status {
      font-size: 13px;
      color: rgba(240,232,213,0.5);
      margin-top: 12px;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <div class="logo">
    <div class="logo-dot"></div>
    <span class="logo-text">GUESTFUL CLICKS</span>
  </div>

  <div class="film-icon">🎞</div>

  <h1 id="heading">You're invited.</h1>
  <p class="sub" id="sub">
    Someone is expecting your shots.<br />Open the app to join the film.
  </p>

  <button class="open-btn" id="openBtn" onclick="openApp()">
    Open in Guestful Clicks →
  </button>
  <div id="status"></div>

  <hr class="divider" />

  <div class="install-section">
    <p class="install-label">Don't have the app yet?</p>
    <div class="store-btns">
      <a class="store-btn" id="androidLink" href="https://play.google.com/store/apps/details?id=com.guestfulclicks.app" target="_blank">
        <span>🤖</span>Android
      </a>
      <a class="store-btn" href="https://apps.apple.com/app/guestful-clicks/id0000000000" target="_blank">
        <span>🍎</span>iPhone
      </a>
    </div>
  </div>

  <div class="code-badge" id="codeBadge" style="display:none">
    <div class="code-label">Event Code</div>
    <div class="code-value" id="codeDisplay"></div>
  </div>

  <p class="note">
    No account needed. Your name is saved for this event only.<br />
    Every angle. Every guest. One gallery.
  </p>

  <script>
    // Extract code from query string
    var params  = new URLSearchParams(window.location.search);
    var code    = params.get('code') || '';
    var deepLink = code
      ? 'guestfulclicks://guest/join?code=' + encodeURIComponent(code)
      : 'guestfulclicks://';

    // Show the code badge so manual entry is possible
    if (code) {
      document.getElementById('codeBadge').style.display = 'block';
      document.getElementById('codeDisplay').textContent = code;
    }

    // Attempt to open app immediately on page load
    function openApp() {
      document.getElementById('status').textContent = 'Opening Guestful Clicks…';
      window.location.href = deepLink;

      // After 2.5 s, assume app is not installed — prompt download
      setTimeout(function () {
        document.getElementById('status').textContent =
          "App didn't open? Download it from the store above.";
      }, 2500);
    }

    // Auto-attempt on load (works on Android when app is installed)
    window.addEventListener('load', function () {
      // Small delay so the page renders first
      setTimeout(openApp, 600);
    });
  </script>

</body>
</html>
